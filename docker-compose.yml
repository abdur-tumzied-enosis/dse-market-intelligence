services:

  # ---------------------------------------------------------------------------
  # TimescaleDB with pgvector
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: dse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dse_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-dse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dse} -d ${POSTGRES_DB:-dse_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis — broker + result backend + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dse_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgBouncer — connection pooler (transaction mode; all app services connect
  # here instead of directly to db:5432; multiplexes ~100 app conns → 20 PG)
  # NOTE: DATABASE_SYNC_URL (APScheduler SQLAlchemy job store) bypasses
  # pgBouncer and connects to db:5432 directly — transaction mode breaks
  # LISTEN/NOTIFY and prepared statements used by SQLAlchemy.
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: dse_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dse}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-dse_intelligence}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      LISTEN_PORT: 6432
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Celery worker — heavy async tasks (PDF extraction, bulk fundamentals, ML)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: dse_worker
    restart: unless-stopped
    command: celery -A extraction.celery_app worker --loglevel=${LOG_LEVEL:-info} --concurrency=4 -Q scraper,nlp,ml,celery
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dse}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-dse_intelligence}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BDSHARE_CACHE_TTL: ${BDSHARE_CACHE_TTL:-60}
      AMARSTOCK_REQUEST_DELAY: ${AMARSTOCK_REQUEST_DELAY:-2.0}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - playwright_browsers:/ms-playwright

  # ---------------------------------------------------------------------------
  # APScheduler — time-based job trigger (runs inside scheduler process)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    container_name: dse_scheduler
    restart: unless-stopped
    command: python -m extraction.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dse}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-dse_intelligence}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Dhaka}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LIVE_PRICES_INTERVAL_MINUTES: ${LIVE_PRICES_INTERVAL_MINUTES:-5}
      MARKET_INDICES_INTERVAL_MINUTES: ${MARKET_INDICES_INTERVAL_MINUTES:-5}
      FUNDAMENTALS_INTERVAL_HOURS: ${FUNDAMENTALS_INTERVAL_HOURS:-6}
      ANNOUNCEMENTS_INTERVAL_HOURS: ${ANNOUNCEMENTS_INTERVAL_HOURS:-1}
      NEWS_INTERVAL_MINUTES: ${NEWS_INTERVAL_MINUTES:-30}
      MACRO_INTERVAL_HOURS: ${MACRO_INTERVAL_HOURS:-24}
      HEALTH_CHECK_INTERVAL_HOURS: ${HEALTH_CHECK_INTERVAL_HOURS:-6}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  # ---------------------------------------------------------------------------
  # Management API (FastAPI — extraction layer admin)
  # ---------------------------------------------------------------------------
  mgmt_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: mgmt
    container_name: dse_mgmt_api
    restart: unless-stopped
    command: uvicorn mgmt.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${MGMT_API_PORT:-8001}:8001"
    env_file: .env
    environment:
      # DATABASE_URL → pgBouncer (transaction pooling)
      # DATABASE_SYNC_URL → db direct (APScheduler SQLAlchemy job store needs it)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dse}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-dse_intelligence}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-dse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dse_intelligence}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: dse_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - mgmt_api

  # ---------------------------------------------------------------------------
  # Grafana — pipeline health dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: dse_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-dse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-dse_intelligence}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  playwright_browsers:
  prometheus_data:
  grafana_data:
