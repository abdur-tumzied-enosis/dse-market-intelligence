[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dse-stock-intelligence"
version = "0.1.0"
description = "DSE Stock Intelligence Platform — Data Extraction Layer"
requires-python = ">=3.12"

dependencies = [
    # Data extraction
    "bdshare==1.2.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.44.0",

    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Scheduling + task queue
    "apscheduler>=3.10.0",
    "celery[redis]>=5.3.0",

    # Database
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Redis
    "redis>=5.0.0",

    # API (mgmt layer)
    "fastapi>=0.111.0",
    "starlette!=1.1.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Auth (product API)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.1.0",

    # LLM (ops agent) — LangChain, provider-switchable
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-google-genai>=2.0.0",

    # Observability
    "prometheus-client>=0.20.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",

    # Feed parsing (news)
    "feedparser>=6.0.11",
    "rapidfuzz>=3.9.0",

    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "ta>=0.11",
    "torch>=2.3",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpretty>=1.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "types-pytz>=2024.1.0",
    "pandas-stubs>=2.2.0",
    "ipython>=8.24.0",
    "rich>=13.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=extraction --cov=api --cov-report=term-missing"
markers = [
    "playwright: tests that require `playwright install chromium`",
]

[tool.hatch.build.targets.wheel]
packages = ["extraction", "db", "mgmt", "ml", "chat", "api"]
